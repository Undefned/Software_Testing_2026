# Включает параллельное выполнение тестов JUnit 5 внутри одного прогона mvn test.
# Именно это позволяет @ParameterizedTest(BrowserType) реально стартовать Chrome и
# Firefox ОДНОВРЕМЕННО, а не последовательно один за другим.
junit.jupiter.execution.parallel.enabled=true
junit.jupiter.execution.parallel.mode.default=concurrent
junit.jupiter.execution.parallel.mode.classes.default=concurrent

# fixed вместо dynamic — чтобы не зависеть от числа ядер CI/ноутбука: гарантированно
# минимум 2 потока, соответствующие двум браузерам.
junit.jupiter.execution.parallel.config.strategy=fixed
junit.jupiter.execution.parallel.config.fixed.parallelism=2
